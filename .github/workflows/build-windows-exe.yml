name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-exe-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_RETRY: 5

jobs:
  windows-exe:
    name: Windows x64 NSIS Installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-exe-release
          cache-bin: false

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Verify hardened Rust backend tests
        shell: bash
        env:
          CARGO_PROFILE_TEST_DEBUG: 0
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib modules::quota::tests
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib modules::account::batch_refresh_tests
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib modules::project_resolver::tests
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib models::config::tests
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib modules::quota_refresh::tests
          node scripts/test-quota.mjs

      - name: Ensure the Windows Tauri CLI binary
        shell: bash
        run: |
          set -euo pipefail
          if node -e "require('@tauri-apps/cli-win32-x64-msvc')" 2>/dev/null; then exit 0; fi
          CLI_VERSION="$(node -p "require('./node_modules/@tauri-apps/cli/package.json').version")"
          curl -fLsS "https://registry.npmjs.org/@tauri-apps/cli-win32-x64-msvc/-/cli-win32-x64-msvc-${CLI_VERSION}.tgz" -o cli-win32.tgz
          mkdir -p node_modules/@tauri-apps/cli-win32-x64-msvc
          tar -xzf cli-win32.tgz -C node_modules/@tauri-apps/cli-win32-x64-msvc --strip-components=1
          node -e "require('@tauri-apps/cli-win32-x64-msvc')"

      - name: Build Windows release and NSIS installer
        shell: pwsh
        run: |
          npm run tauri build -- --no-bundle -- --locked
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          npm run tauri bundle -- --bundles nsis --config src-tauri/tauri.windows.bundle.conf.json
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }

      - name: Verify built executables
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes('src-tauri/target/release/agy-switch-desktop.exe')
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x8664) { throw 'Expected x64 APP payload' }
          node scripts/test-cli.mjs src-tauri/target/release/agy-switch-desktop.exe
          if ($LASTEXITCODE -ne 0) { throw 'Desktop CLI smoke failed' }
          node scripts/test-cli.mjs src-tauri/target/release/agy-switch.exe
          if ($LASTEXITCODE -ne 0) { throw 'Console CLI smoke failed' }

      - name: Stage Windows NSIS installer artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          VERSION="$(node -p "require('./package.json').version")"
          installers=(src-tauri/target/release/bundle/nsis/*.exe)
          if (( ${#installers[@]} != 1 )); then
            echo "Expected exactly one NSIS installer, found ${#installers[@]}" >&2
            exit 1
          fi
          mkdir -p artifacts/windows-exe
          PACKAGE="artifacts/windows-exe/agy-switch-${VERSION}-windows-x64-setup.exe"
          cp "${installers[0]}" "$PACKAGE"
          node scripts/release-assets.mjs checksum "$PACKAGE"
          VERSION="$VERSION" node --input-type=module -e 'import { writeFileSync } from "node:fs"; import { execFileSync } from "node:child_process"; writeFileSync("artifacts/windows-exe/build-info.json", JSON.stringify({ version: process.env.VERSION, commit: execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim(), run_id: process.env.GITHUB_RUN_ID, architecture: "x64", installer: "nsis", distribution: "Unsigned CI build; not a signed GitHub Release" }, null, 2) + "\n");'

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: agy-switch-windows-x64-setup
          path: artifacts/windows-exe/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
